name: Building & Deploying

on:
    workflow_dispatch:
    push:
        branches: [main, development]
        paths:
            - "infra/app/**/*"
            - ".env.schema"
            - ".github/workflows/deploy.yml"
            - "package.json"
            - "packages/**/*"
            - "backend/**/*"
            - "frontend/**/*"
            - "!**/*.md"

jobs:
    deploy:
        name: Building & Deploying
        environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
        runs-on: ubuntu-latest
        env:
            ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
            DOMAIN_NAME: ${{ github.ref == 'refs/heads/main' && 'finquo.ai' || 'dev.finquo.ai' }}

        steps:
            - uses: oNaiPs/secrets-to-env-action@v1
              with:
                  secrets: ${{ toJSON(secrets) }}
                  vars: ${{ toJSON(vars) }}

            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Bun.js
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "latest"

            - name: Install dependencies
              run: bun i

            - name: Build Frontend & Backend
              run: bun run construct

            - name: Package OpenNext server
              run: |
                  cd frontend/.open-next/server-functions/default
                  zip -qr "$GITHUB_WORKSPACE/build.zip" .
                  ls -lh "$GITHUB_WORKSPACE/build.zip"

            - name: Load environment variables as JSON
              id: varlock_json
              uses: dmno-dev/varlock-action@v1.0.1
              with:
                  output-format: "json"

            - name: Write env.json
              env:
                  VARLOCK_JSON: ${{ steps.varlock_json.outputs.json-env }}
              run: |
                  printf '%s' "$VARLOCK_JSON" > env.json
                  echo "env.json item count: $(jq 'length' env.json)"

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ap-south-1

            - name: Setup OpenTofu
              uses: opentofu/setup-opentofu@v1
              with:
                  cache: true

            - name: OpenTofu Init & Apply (app)
              env:
                  TF_VAR_domain_name: ${{ env.DOMAIN_NAME }}
                  TF_VAR_environment: ${{ env.ENVIRONMENT }}
              run: |
                  cd infra/app
                  tofu init -backend-config="bucket=finquo-junior-opentofu-${TF_VAR_environment}"
                  tofu apply -auto-approve

            - name: Upload static assets
              run: |
                  aws s3 sync frontend/.open-next/assets "s3://finquo-junior-media-${ENVIRONMENT}/_assets" --delete
                  cd infra/app
                  aws cloudfront create-invalidation \
                      --distribution-id "$(tofu output -raw cloudfront_distribution_id)" \
                      --paths "/*"
