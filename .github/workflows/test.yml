name: Test Environment Secrets & Variables

on:
    workflow_dispatch:
    push:
        branches: [main, development]
        paths:
            - ".github/workflows/*.yml"
            - ".env.schema"

jobs:
    test-env:
        name: Test Env
        runs-on: ubuntu-latest
        environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
        env:
            ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
            DOMAIN_NAME: ${{ github.ref == 'refs/heads/main' && 'finquo.ai' || 'dev.finquo.ai' }}

        steps:
            - name: Print basic info
              run: |
                  echo "CI=$CI"
                  echo "RUNNER_OS=$RUNNER_OS"
                  echo "github.ref=${{ github.ref }}"

            - name: Print TF vars
              env:
                  TF_VAR_domain_name: ${{ env.DOMAIN_NAME }}
                  TF_VAR_environment: ${{ env.ENVIRONMENT }}
              run: |
                  echo "ENVIRONMENT=$ENVIRONMENT"
                  echo "DOMAIN_NAME=$DOMAIN_NAME"
                  echo "TF_VAR_environment=$TF_VAR_environment"
                  echo "TF_VAR_domain_name=$TF_VAR_domain_name"

            - uses: oNaiPs/secrets-to-env-action@v1
              with:
                  secrets: ${{ toJSON(secrets) }}
                  vars: ${{ toJSON(vars) }}

            - name: Checkout
              uses: actions/checkout@v7

            - name: Load environment variables
              id: varlock_json
              uses: dmno-dev/varlock-action@v1.0.1
              with:
                  output-format: "json"

            - name: Write env.json
              env:
                  VARLOCK_JSON: ${{ steps.varlock_json.outputs.json-env }}
              run: printf '%s' "$VARLOCK_JSON" > env.json

            - name: Print env loaded by varlock
              run: |
                  echo "EXPORT=$EXPORT"
                  echo "DATABASE_URL (length): ${#DATABASE_URL}"
