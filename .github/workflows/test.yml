name: Test Environment Secrets & Variables

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - ".github/workflows/*.yml"

jobs:
    test-env:
        runs-on: ubuntu-latest
        environment: development
        env:
            BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
            BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
            CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
            NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}
            EXPORT: ${{ vars.EXPORT }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Load environment variables
              uses: dmno-dev/varlock-action@v1.0.1

            - name: Print env and secrets info
              run: |
                  echo "Basic env check"
                  echo "CI=$CI"
                  echo "RUNNER_OS=$RUNNER_OS"

                  echo "Vars loaded by Varlock"
                  echo "EXPORT=$EXPORT"
                  echo "DATABASE_URL (length): ${#DATABASE_URL}"
                  echo "BETTER_AUTH_URL=$BETTER_AUTH_URL"
