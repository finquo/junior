name: Test Environment Secrets & Variables

on:
    workflow_dispatch:
    push:
        branches: [main, development]
        paths:
            - ".github/workflows/*.yml"
            - ".env.schema"

jobs:
    test-env:
        runs-on: ubuntu-latest
        environment: development

        steps:
            - uses: oNaiPs/secrets-to-env-action@v1
              with:
                  secrets: ${{ toJSON(secrets) }}
                  vars: ${{ toJSON(vars) }}

            - name: Checkout
              uses: actions/checkout@v7

            - name: Load environment variables
              id: varlock_json
              uses: dmno-dev/varlock-action@v1.0.1
              with:
                  output-format: "json"

            - name: Write env.json
              env:
                  VARLOCK_JSON: ${{ steps.varlock_json.outputs.json-env }}
              run: printf '%s' "$VARLOCK_JSON" > env.json

            - name: Verify env.json
              run: |
                  echo "Item count: $(jq 'length' env.json)"
                  echo "Key name and JSON value type (used by the Terraform tostring filter):"
                  jq -r 'to_entries[] | "\(.key)=\(.value | type)"' env.json

            - name: Print env and secrets info
              run: |
                  echo "Basic env check"
                  echo "CI=$CI"
                  echo "RUNNER_OS=$RUNNER_OS"

                  echo "Vars loaded by Varlock"
                  echo "EXPORT=$EXPORT"
                  echo "DATABASE_URL (length): ${#DATABASE_URL}"
                  echo "BETTER_AUTH_URL=$BETTER_AUTH_URL"
