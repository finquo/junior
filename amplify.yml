version: 1
applications:
    - appRoot: frontend
      frontend:
          buildPath: /
          phases:
              preBuild:
                  commands:
                      - nvm use 24 && node --version
                      - npm i -g bun
                      - bun --version
                      - bun i --frozen-lockfile
                      - bun run script/env.ts
                      - cat .env
              build:
                  commands:
                      - bun run construct
          artifacts:
              baseDirectory: frontend/.amplify-hosting
              files:
                  - "**/*"
          cache:
              paths:
                  - node_modules/**/*
